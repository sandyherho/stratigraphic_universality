[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stratigraphic_universality"
version = "0.1.0"
description = "Supplementary code for an idealized model of universality and information loss in the stratigraphic record"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Sandy H. S. Herho", email = "sandyherho@itb.ac.id"},
  {name = "Dasapta E. Irawan", email = "dasaptaerwin@itb.ac.id"},
  {name = "Rubiyanto Kapid"},
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pillow>=9"]
keywords = ["stratigraphy", "sadler-effect", "record-statistics", "persistence", "cyclostratigraphy"]

[tool.setuptools]
packages = ["stratigraphic_universality"]
